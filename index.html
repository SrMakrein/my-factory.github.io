<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Factorio Web - Juego de Automatización</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #fff;
        overflow: hidden;
        position: fixed;
      }

      #gameContainer {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      }

      canvas {
        display: block;
        background: #2a2a2a;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }

      ::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #666;
      }

      ::selection {
        background: rgba(100, 200, 255, 0.5);
        color: #fff;
      }

      #consoleButton {
        position: fixed;
        bottom: 240px;
        left: 20px;
        width: 50px;
        height: 50px;
        background: #2a4a2a;
        border: 2px solid #4a8a4a;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #4a8a4a;
        transition: all 0.3s ease;
        z-index: 1000;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
      }

      #consoleButton:hover {
        width: 60px;
        height: 60px;
        font-size: 28px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        border-color: #00ff00;
        color: #00ff00;
      }

      /* ===== BOTÓN DE PAPELERA ===== */
      #resetButton {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        background: #4a2a2a;
        border: 2px solid #8a4a4a;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #8a4a4a;
        transition: all 0.3s ease;
        z-index: 1000;
        box-shadow: 0 0 10px rgba(255, 100, 100, 0.3);
      }

      #resetButton:hover {
        width: 60px;
        height: 60px;
        font-size: 28px;
        box-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
        border-color: #ff6464;
        color: #ff6464;
      }

      /* ===== MODAL DE CONFIRMACIÓN ===== */
      #resetModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 3000;
      }

      #resetModal.visible {
        display: flex;
      }

      .resetModalContent {
        background: #1a1a1a;
        border: 2px solid #8a4a4a;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        max-width: 400px;
      }

      .resetModalContent h2 {
        color: #ff6464;
        font-size: 1.5rem;
        margin-bottom: 15px;
      }

      .resetModalContent p {
        color: #aaa;
        font-size: 1rem;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .resetModalButtons {
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      .resetModalButtons button {
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .resetConfirmBtn {
        background: linear-gradient(135deg, #ff6464, #ff8080);
        color: #fff;
      }

      .resetConfirmBtn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 100, 100, 0.5);
      }

      .resetCancelBtn {
        background: #2a4a2a;
        color: #4a8a4a;
        border: 2px solid #4a8a4a;
      }

      .resetCancelBtn:hover {
        background: #3a5a3a;
        border-color: #6aaa6a;
        color: #6aaa6a;
      }

      #consolePanel {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 400px;
        height: 300px;
        background: #1a1a1a;
        border: 2px solid #4a8a4a;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        z-index: 1000;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }

      #consolePanel.open {
        display: flex;
      }

      #consoleHeader {
        padding: 10px 15px;
        background: #2a4a2a;
        border-bottom: 1px solid #4a8a4a;
        font-weight: bold;
        color: #4a8a4a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #consoleHeader button {
        background: #4a8a4a;
        border: none;
        color: #1a1a1a;
        padding: 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-weight: bold;
      }

      #consoleHeader button:hover {
        background: #6aaa6a;
      }

      #consoleOutput {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        font-family: "Courier New", monospace;
        font-size: 11px;
        color: #4a8a4a;
        line-height: 1.4;
      }

      .log-info { color: #4a8a4a; }
      .log-error { color: #ff6b6b; }
      .log-warn { color: #ffd93d; }
      .log-debug { color: #87ceeb; }

      /* ===== OVERLAY DE INICIO ===== */
      #startOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        overflow: hidden;
      }

      #startOverlay.hidden {
        display: none;
      }

      .floating-icons {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .floating-icon {
        position: absolute;
        font-size: 4rem;
        opacity: 0.15;
        animation: float 8s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-30px) rotate(5deg);
        }
      }

      .overlay-content {
        position: relative;
        z-index: 10;
        text-align: center;
      }

      .overlay-title {
        font-size: 4rem;
        font-weight: bold;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #64c8ff, #00ff88);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
      }

      .overlay-subtitle {
        font-size: 1.2rem;
        color: #aaa;
        margin-bottom: 50px;
        letter-spacing: 2px;
      }

      .start-button {
        padding: 18px 60px;
        font-size: 1.3rem;
        font-weight: bold;
        background: linear-gradient(135deg, #00cc88, #00ff99);
        color: #000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      }

      .start-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.3);
        transition: left 0.5s ease;
        z-index: -1;
      }

      .start-button:hover::before {
        left: 100%;
      }

      .start-button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        letter-spacing: 2px;
      }

      .start-button:active {
        transform: scale(0.95);
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      }

      .pulse-animation {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        50% {
          box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        }
      }
    </style>
  </head>
  <body>
    <!-- OVERLAY DE INICIO -->
    <div id="startOverlay">
      <div class="floating-icons" id="floatingIconsContainer"></div>
      <div class="overlay-content">
        <div class="overlay-title">⚙️ FACTORIO WEB</div>
        <div class="overlay-subtitle">JUEGO DE AUTOMATIZACIÓN</div>
        <button class="start-button pulse-animation" onclick="startGame()">
          ▶ INICIAR JUEGO
        </button>
      </div>
    </div>

    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>
      <button id="consoleButton">█</button>
      <button id="resetButton">🗑️</button>
      <div id="resetModal">
        <div class="resetModalContent">
          <h2>⚠️ REINICIAR PARTIDA</h2>
          <p>¿Estás seguro de que deseas reiniciar la partida?<br><br>Se eliminarán todos los edificios y recursos.</p>
          <div class="resetModalButtons">
            <button class="resetConfirmBtn" onclick="confirmReset()">REINICIAR</button>
            <button class="resetCancelBtn" onclick="cancelReset()">CANCELAR</button>
          </div>
        </div>
      </div>
      <div id="consolePanel">
        <div id="consoleHeader">
          <span>CONSOLA</span>
          <button onclick="document.getElementById('consoleOutput').innerHTML = ''">Limpiar</button>
        </div>
        <div id="consoleOutput"></div>
      </div>
    </div>

    <!-- ===================================================================
         IMPORTACIÓN DE MÓDULOS
         Los módulos se cargan en orden de dependencias.
         Orden crítico: Constants → Data → UI → Rendering → Systems → Gameplay → Core
         =================================================================== -->

    <!-- CORE: Constantes y Configuración -->
    <script src="src/core/constants.js"></script>

    <!-- DATA: Información estática (Investigaciones, Misiones) -->
    <script src="src/data/research-tree.js"></script>
    <script src="src/data/mission-system.js"></script>

    <!-- UI: Sistema de logging y consola -->
    <script src="src/ui/console-logger.js"></script>

    <!-- RENDERING: Generadores de gráficos y caché -->
    <script src="src/rendering/sprite-generator.js"></script>
    <script src="src/rendering/sprite-cache.js"></script>

    <!-- SYSTEMS: Sistemas principales del juego -->
    <script src="src/systems/grid-system.js"></script>
    <script src="src/systems/camera-system.js"></script>

    <!-- RENDERING: Renderer (depende de camera, grid, sprite-cache) -->
    <script src="src/rendering/renderer.js"></script>

    <!-- CORE: Game Loop (depende de todo lo anterior) -->
    <script src="src/core/game-loop.js"></script>

    <!-- Inicializar el juego -->
    <script>
      // Recursos para los iconos flotantes
      const RESOURCE_ICONS = {
        wood: '🪵',
        iron: '⚒️',
        copper: '🧲',
        stone: '🪨',
        coal: '⬛',
        water: '💧',
        energy: '⚡',
        oil: '🛢️'
      };

      // Generar iconos flotantes en el overlay
      function generateFloatingIcons() {
        const container = document.getElementById('floatingIconsContainer');
        const icons = Object.values(RESOURCE_ICONS);
        
        // Crear 15 iconos flotantes
        for (let i = 0; i < 15; i++) {
          const icon = document.createElement('div');
          icon.className = 'floating-icon';
          icon.textContent = icons[i % icons.length];
          
          // Posición aleatoria
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          icon.style.left = x + '%';
          icon.style.top = y + '%';
          
          // Duración de animación variable
          const duration = 6 + Math.random() * 4;
          icon.style.animationDuration = duration + 's';
          
          // Retraso inicial
          icon.style.animationDelay = Math.random() * 2 + 's';
          
          // Opacidad variable
          icon.style.opacity = (0.1 + Math.random() * 0.15).toString();
          
          container.appendChild(icon);
        }
      }

      // Iniciar el juego al hacer clic en el botón
      function startGame() {
        const overlay = document.getElementById('startOverlay');
        overlay.classList.add('hidden');
        
        // Iniciar el GameLoop después de que desaparezca el overlay
        setTimeout(() => {
          const gameCanvas = document.getElementById('gameCanvas');
          const gameLoop = new GameLoop('gameCanvas');
          gameLoop.start();

          const canvas = document.querySelector('canvas');
          if (canvas) {
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
          }

          console.log("%c CONTROLES DEL JUEGO ", "background: #333; color: #0f0; font-weight: bold; padding: 5px;");
          console.log(
            "%c M = Minero | C = Cinta | A = Almacén | F = Fundición | E = Ensamblador | L = Laboratorio",
            "background: #222; color: #0f0; padding: 5px;"
          );
          console.log(
            "%c U = Ens.Avanzado (Nv.2) | P = Refinería (Nv.3) | Espacio = Pausa | S = Guardar",
            "background: #222; color: #0f0; padding: 5px;"
          );
          console.log("%c Click izq = Colocar | Click der = Cancelar | Rueda = Zoom", "background: #222; color: #0f0; padding: 5px;");
        }, 300);
      }

      document.addEventListener('DOMContentLoaded', () => {
        console.log('🏭 Iniciando Factorio Web (Modularizado)...');
        generateFloatingIcons();
        
        // Event listener para botón de reset
        const resetButton = document.getElementById('resetButton');
        if (resetButton) {
          resetButton.addEventListener('click', () => {
            document.getElementById('resetModal').classList.add('visible');
          });
        }
      });

      // Funciones para el modal de reset
      function confirmReset() {
        document.getElementById('resetModal').classList.remove('visible');
        
        // Limpiar localStorage
        localStorage.removeItem('gameState');
        
        // Recargar la página para regenerar el juego
        window.location.reload();
      }

      function cancelReset() {
        document.getElementById('resetModal').classList.remove('visible');
      }

      // Cerrar modal si se hace clic fuera de él
      document.addEventListener('click', (e) => {
        const resetModal = document.getElementById('resetModal');
        if (e.target === resetModal) {
          cancelReset();
        }
      });
    </script>
  </body>
</html>
